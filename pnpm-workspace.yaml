# pnpm 10: only these packages may run install/postinstall scripts
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Same build toolchain as the monorepo the package was extracted from, so dist
# stays byte-identical to the published 6.0.1
overrides:
  rolldown: 1.3.2
  rolldown-plugin-dts: 0.30.1
