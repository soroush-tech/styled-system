name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check release notes
        run: pnpm check:release-notes

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          slug: soroush-tech/styled-system

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

  # Performance gate: the bench suite runs in the pinned Docker sandbox against the last
  # npm release (via soroush-tech/bench-action); any case below the minimum speed ratio
  # fails the job - and, via ci-ok, the PR.
  bench:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # bench-action posts/updates the results comment
      id-token: write # OIDC token for the branded comment relay (api.bench.soroush.tech)
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The bench file imports this package's built dist so the comparison
      # against the npm release's prebuilt dist is like-for-like.
      - name: Build
        run: pnpm build

      # Mint a token from the org's GitHub App so the results comment is posted
      # under the brand bot identity instead of github-actions[bot]. Skipped (and
      # the gate falls back to GITHUB_TOKEN) when the app isn't configured.
      - name: Mint bot token
        id: bot-token
        if: vars.BENCH_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BENCH_BOT_APP_ID }}
          private-key: ${{ secrets.BENCH_BOT_PRIVATE_KEY }}
          # Scope the minted token to commenting only, instead of inheriting every
          # permission the app installation has.
          permission-pull-requests: write

      - name: Run benchmark gate
        # Our own action, pinned like any other: `v1` is a tag, and a tag moves.
        uses: soroush-tech/bench-action@b527ad437545189516e36ee3c29f6aeb09c3557e # v1.1.1
        with:
          bench-dir: bench
          baseline-case: previous
          min-ratio: '80'
          github-token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}

  # Single stable status check for branch protection: fails only if a required
  # job actually failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, build, bench]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled."
          exit 1
